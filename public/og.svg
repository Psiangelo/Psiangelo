<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fundo -->
  <rect width="1200" height="630" fill="#0E0C0A" />

  <!-- Borda dupla dourada sutil -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#B48C50" stroke-opacity="0.35" stroke-width="1" />
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#B48C50" stroke-opacity="0.15" stroke-width="0.6" />

  <!-- Triângulo vazado acima do nome -->
  <polygon points="600,140 636,230 564,230" fill="none" stroke="#B48C50" stroke-opacity="0.65" stroke-width="1.6" />
  <circle cx="600" cy="196" r="6" fill="#B48C50" />

  <!-- Linha horizontal superior (frame) -->
  <line x1="180" y1="280" x2="1020" y2="280" stroke="#B48C50" stroke-opacity="0.45" stroke-width="1.2" />
  <circle cx="180" cy="280" r="4" fill="#B48C50" />
  <circle cx="1020" cy="280" r="4" fill="#B48C50" />

  <!-- Wordmark central -->
  <text x="600" y="410"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-size="150"
        fill="#E8DDD0"
        letter-spacing="-2">Psi<tspan fill="#B48C50">angelo</tspan></text>

  <!-- Linha horizontal inferior (frame) -->
  <line x1="180" y1="460" x2="1020" y2="460" stroke="#B48C50" stroke-opacity="0.45" stroke-width="1.2" />
  <circle cx="180" cy="460" r="4" fill="#B48C50" />
  <circle cx="1020" cy="460" r="4" fill="#B48C50" />

  <!-- Tagline -->
  <text x="600" y="520"
        text-anchor="middle"
        font-family="Courier New, monospace"
        font-size="22"
        fill="#B48C50"
        letter-spacing="10">PSICOLOGIA · ANALÍTICA</text>

  <!-- Grego discreto no rodapé -->
  <text x="600" y="568"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-style="italic"
        font-size="22"
        fill="#B8AD9E"
        fill-opacity="0.6">γνῶθι σεαυτόν · Nosce te ipsum</text>
</svg>
